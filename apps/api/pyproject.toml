[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "intihal-api"
version = "0.1.0"
description = "Doküman Benzerlik Tespit Sistemi API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "celery[redis]>=5.6,<5.7",
    "charset-normalizer>=3.4,<4.0",
    "fastapi>=0.116,<1.0",
    "minio>=7.2,<8.0",
    "pymupdf>=1.26,<2.0",
    "pydantic-settings>=2.10,<3.0",
    "pypdf>=6.1,<7.0",
    "python-docx>=1.2,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy[asyncio]>=2.0.43,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1.0",
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
where = ["src"]
