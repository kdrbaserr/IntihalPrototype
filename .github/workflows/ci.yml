name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API - Ruff and Pytest
    runs-on: ubuntu-latest
    env:
      INTIHAL_TEST_DATABASE_URL: postgresql+asyncpg://intihal_test:intihal_test@localhost:5432/intihal_test
    services:
      postgres:
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_DB: intihal_test
          POSTGRES_USER: intihal_test
          POSTGRES_PASSWORD: intihal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intihal_test -d intihal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run Pytest
        run: pytest

  web:
    name: Web - ESLint, Tests and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build Next.js application
        run: npm run build
